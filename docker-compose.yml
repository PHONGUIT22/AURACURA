services:
  backend:
    build:
      context: ./backend-mcp
      dockerfile: Dockerfile
    container_name: curavip-backend-mcp
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_PATH=/app/data/curavip.db
      - QLOO_API_KEY=${QLOO_API_KEY:-}
      - QLOO_API_URL=${QLOO_API_URL:-https://hackathon.api.qloo.com}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_CLAUDE_MODEL_ID=${BEDROCK_CLAUDE_MODEL_ID:-anthropic.claude-3-5-sonnet-20241022-v2:0}
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: curavip-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_MCP_URL=http://localhost:3001
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
